<ng-container>
  <c-container [fluid]="true">
    <c-header-nav class="d-none d-lg-flex me-auto">
      <c-nav-item>
        <a cNavLink routerLink="/dashboard" routerLinkActive="active" class="button-link">
          Gaceta
        </a>
      </c-nav-item>
        <c-nav-item>
          <a cNavLink routerLink="/slider" routerLinkActive="active" class="button-link">Slider</a>
        </c-nav-item>
    </c-header-nav>
    <c-header-nav class="d-none d-lg-flex">
      <h1>{{userActual}}</h1>
    </c-header-nav>
    <c-header-nav class="ms-3">
      <ng-container *ngTemplateOutlet="userDropdown"></ng-container>
    </c-header-nav>
  </c-container>
</ng-container>

<ng-template #userDropdown>
  <c-dropdown alignment="end" variant="nav-item">
    <button cButton color="" [caret]="false" cDropdownToggle class="py-0">
      <c-avatar cTextColor="primary" shape="rounded-1" size="md" src="./assets/img/avatars/10.png" status="success">
      </c-avatar>
    </button>
    <ul cDropdownMenu class="pt-0 pr-5 w-auto">
      <li>
        <h6 cDropdownHeader class="bg-light fw-semibold py-2">Configuración</h6>
      </li>
      <li></li>
      <li>
        <hr cDropdownDivider />
      </li>
      <li>
        <a cDropdownItem>{{userActual}}</a>
        <a cDropdownItem (click)="logout()">
          <svg cIcon class="me-2" name="cilLockLocked"></svg>
          Salir
        </a>
      </li>
      <li></li>
    </ul>
  </c-dropdown>
</ng-template>
