<c-row ngPreserveWhitespaces>
    <c-col xs="12">
        <c-card class="mb-4" id="AngularButton">
            <c-card-header>
                <strong>Gaceta pdf</strong>
            </c-card-header>
            <c-card-body>
                <form autocomplete="off" [formGroup]="frmFile" (submit)="saveData()">
                    <div class="row">
                        <div class="col-sm-4">
                            <mat-form-field appearance="outline" class="w-100">
                                <mat-label>Titulo</mat-label>
                                <input matInput placeholder="Titulo" formControlName="title">
                            </mat-form-field>
                        </div>

                        <div class="col-sm-4">
                            <mat-form-field appearance="outline" class="w-100">
                                <mat-label>Descripcion</mat-label>
                                <input matInput placeholder="Descripcion" formControlName="description">
                            </mat-form-field>
                        </div>

                        <div class="col-sm-4">
                            <mat-form-field appearance="outline" class="w-100">
                                <mat-label>Subdescripcion</mat-label>
                                <input matInput placeholder="Descripcion" formControlName="description2">
                            </mat-form-field>
                        </div>
                        
                        <input *ngIf="this.id == null" type="file" accept=".pdf" (change)="onFileSelected($event)" #pdfInput>
                        
                    </div>
                    <div class="row">
                        <div class="col-sm-12 text-end">
                            <button cButton [color]="'success'" type="submit">Guardar</button>
                            <button cButton [color]="'danger'" (click)="clickCancel()" type="button">Cancelar</button>
                        </div>
                    </div>
                </form>

            </c-card-body>
        </c-card>
    </c-col>
</c-row>
