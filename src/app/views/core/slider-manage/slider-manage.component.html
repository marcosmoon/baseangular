
<div class="container">
    <c-row ngPreserveWhitespaces>
        <c-col xs="12">
            <c-card class="mb-4" id="AngularButton">
                <c-card-header>
                    <strong>Slider</strong>
                </c-card-header>
                <c-card-body>
                    <c-row>
                        <c-col>
                            <button cButton [color]="'success'" (click)="clickAdd()" >Nueva imagen</button>
                        </c-col>
                    </c-row>
                    <br>
                    <c-row>
                    </c-row>
                    <c-col xs="12">
                        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 w-100" matTableExporter
                            #exporter="matTableExporter" [hiddenColumns]="[8]">
                            <ng-container matColumnDef="id">
                                <th mat-header-cell *matHeaderCellDef> Id </th>
                                <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
                            </ng-container>                        

                            <ng-container matColumnDef="image">
                                <th mat-header-cell *matHeaderCellDef> Imagen </th>
                                <td mat-cell *matCellDef="let element">
                                    <a class="pointer" (click)="show_image(element.id)" matTooltip="image" style="color: #3f64dd;">
                                        <mat-icon style="color: red;" *ngIf="element.id == null">image_not_supported</mat-icon>
                                        <mat-icon *ngIf="element.image">photo_camera</mat-icon>
                                    </a>
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="descripcion">
                                <th mat-header-cell *matHeaderCellDef> Descripcion</th>
                                <td mat-cell *matCellDef="let element"> {{element.description}}</td>
                            </ng-container>
     
                            <ng-container matColumnDef="editar">
                                <th mat-header-cell *matHeaderCellDef class="center"> Editar </th>
                                <td mat-cell *matCellDef="let element">
                                    <div class="sectionsButtons">
                                        <button cButton [color]="'primary'" size="sm" variant="outline" mat-icon-button
                                            (click)="clickUpdate('imagen', element.id)">
                                            <mat-icon>edit</mat-icon>
                                        </button>
                                    </div>
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="eliminar">
                                <th mat-header-cell *matHeaderCellDef class="center"> Eliminar </th>
                                <td mat-cell *matCellDef="let element">
                                  <div class="sectionsButtons">
                                    <button cButton [color]="'warn'" size="sm" variant="outline" mat-icon-button
                                      (click)="clickDelete(element.id)">
                                      <mat-icon>delete</mat-icon>
                                    </button>
                                  </div>
                                </td>
                              </ng-container>
                            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                        </table> 

                        <mat-paginator [pageSizeOptions]="[5, 10, 15]" [pageSize]="5" showFirstLastButtons>
                        </mat-paginator>
                    </c-col>
                </c-card-body>
            </c-card>
        </c-col>
    </c-row>
</div>
